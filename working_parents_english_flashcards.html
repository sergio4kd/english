    <script>
        // State variables
        let currentCategory = "All Categories";
        let searchQuery = "";
        let showOnlyMastered = false;
        let viewMode = "single"; // "single" or "grid"
        let currentSingleIndex = 0;
        let cardsData = [...FLASHCARDS_DATA];

        // Mastered LocalStorage
        let masteredCardIds = new Set(JSON.parse(localStorage.getItem("parents_mastered_cards") || "[]"));

        // Elements
        const categoryFiltersContainer = document.getElementById("category-filters");
        const searchInput = document.getElementById("search-input");
        const shuffleBtn = document.getElementById("shuffle-btn");
        const toggleFilterMasteredBtn = document.getElementById("toggle-filter-mastered");
        const masteredFilterLabel = document.getElementById("mastered-filter-label");
        const progressText = document.getElementById("progress-text");
        const progressBar = document.getElementById("progress-bar");
        const resetProgressBtn = document.getElementById("reset-progress-btn");

        const viewSingleBtn = document.getElementById("view-single-btn");
        const viewGridBtn = document.getElementById("view-grid-btn");
        const singleViewContainer = document.getElementById("single-view-container");
        const gridViewContainer = document.getElementById("grid-view-container");
        const emptyState = document.getElementById("empty-state");

        const singleCardInner = document.getElementById("single-card-inner");
        const prevCardBtn = document.getElementById("prev-card-btn");
        const nextCardBtn = document.getElementById("next-card-btn");
        const cardCounter = document.getElementById("card-counter");

        // Speech Synthesis setup
        const synth = window.speechSynthesis;

        function speakText(text) {
            if (!synth) {
                alert("Text-to-speech is not supported in this browser.");
                return;
            }
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-US";
            utterance.rate = 0.85; // Slightly relaxed speech rate for learners
            synth.speak(utterance);
        }

        function initApp() {
            renderCategoryButtons();
            updateProgress();
            renderViews();

            // Event Listeners
            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                currentSingleIndex = 0;
                renderViews();
            });

            shuffleBtn.addEventListener("click", () => {
                shuffleArray(cardsData);
                currentSingleIndex = 0;
                renderViews();
            });

            toggleFilterMasteredBtn.addEventListener("click", () => {
                showOnlyMastered = !showOnlyMastered;
                masteredFilterLabel.textContent = showOnlyMastered ? "Mastered Only" : "Show All";
                toggleFilterMasteredBtn.classList.toggle("bg-emerald-500/20", showOnlyMastered);
                toggleFilterMasteredBtn.classList.toggle("border-emerald-500/50", showOnlyMastered);
                currentSingleIndex = 0;
                renderViews();
            });

            resetProgressBtn.addEventListener("click", () => {
                if (confirm("Reset all mastered flashcards progress?")) {
                    masteredCardIds.clear();
                    saveMasteredState();
                    updateProgress();
                    renderViews();
                }
            });

            viewSingleBtn.addEventListener("click", () => setViewMode("single"));
            viewGridBtn.addEventListener("click", () => setViewMode("grid"));

            prevCardBtn.addEventListener("click", () => navigateSingle(-1));
            nextCardBtn.addEventListener("click", () => navigateSingle(1));

            lucide.createIcons();
        }

        function setViewMode(mode) {
            viewMode = mode;
            if (mode === "single") {
                viewSingleBtn.className = "p-1.5 rounded-lg text-amber-400 bg-slate-700 transition-colors";
                viewGridBtn.className = "p-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition-colors";
                singleViewContainer.classList.remove("hidden");
                gridViewContainer.classList.add("hidden");
            } else {
                viewGridBtn.className = "p-1.5 rounded-lg text-amber-400 bg-slate-700 transition-colors";
                viewSingleBtn.className = "p-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition-colors";
                singleViewContainer.classList.add("hidden");
                gridViewContainer.classList.remove("hidden");
            }
            renderViews();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function saveMasteredState() {
            localStorage.setItem("parents_mastered_cards", JSON.stringify([...masteredCardIds]));
        }

        function updateProgress() {
            const total = FLASHCARDS_DATA.length;
            const count = masteredCardIds.size;
            const percentage = Math.round((count / total) * 100);
            
            progressText.textContent = `${count}/${total} Cards`;
            progressBar.style.width = `${percentage}%`;
        }

        function getFilteredCards() {
            return cardsData.filter(card => {
                const matchesCategory = (currentCategory === "All Categories") || (card.category === currentCategory);
                
                const matchesSearch = searchQuery === "" || 
                    card.question.toLowerCase().includes(searchQuery) ||
                    card.starter.toLowerCase().includes(searchQuery) ||
                    card.hint.toLowerCase().includes(searchQuery) ||
                    card.words.some(w => w.en.toLowerCase().includes(searchQuery) || w.es.toLowerCase().includes(searchQuery));

                const matchesMastered = !showOnlyMastered || masteredCardIds.has(card.id);

                return matchesCategory && matchesSearch && matchesMastered;
            });
        }

        function renderCategoryButtons() {
            categoryFiltersContainer.innerHTML = CATEGORIES.map(cat => {
                const isActive = cat === currentCategory;
                const activeClasses = isActive 
                    ? "bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/20" 
                    : "bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800";
                return `
                    <button 
                        onclick="selectCategory('${cat}')" 
                        class="px-3.5 py-1.5 rounded-xl transition-all whitespace-nowrap text-xs font-medium ${activeClasses}">
                        ${cat}
                    </button>
                `;
            }).join("");
        }

        window.selectCategory = function(cat) {
            currentCategory = cat;
            currentSingleIndex = 0;
            renderCategoryButtons();
            renderViews();
        }

        function navigateSingle(direction) {
            const filtered = getFilteredCards();
            if (filtered.length === 0) return;

            currentSingleIndex = (currentSingleIndex + direction + filtered.length) % filtered.length;
            renderSingleCard(filtered);
        }

        function renderViews() {
            const filtered = getFilteredCards();

            if (filtered.length === 0) {
                emptyState.classList.remove("hidden");
                singleViewContainer.classList.add("hidden");
                gridViewContainer.classList.add("hidden");
                return;
            } else {
                emptyState.classList.add("hidden");
                if (viewMode === "single") singleViewContainer.classList.remove("hidden");
                if (viewMode === "grid") gridViewContainer.classList.remove("hidden");
            }

            if (currentSingleIndex >= filtered.length) {
                currentSingleIndex = 0;
            }

            renderSingleCard(filtered);
            renderGridCards(filtered);
        }

        function renderSingleCard(filtered) {
            const card = filtered[currentSingleIndex];
            const isMastered = masteredCardIds.has(card.id);

            cardCounter.textContent = `Card ${currentSingleIndex + 1} of ${filtered.length}`;

            singleCardInner.className = "relative w-full h-full duration-500 transform-style-3d cursor-pointer group";

            singleCardInner.innerHTML = `
                <!-- FRONT OF CARD -->
                <div class="absolute inset-0 w-full h-full bg-slate-900 border ${isMastered ? 'border-emerald-500/60' : 'border-slate-800'} rounded-3xl p-6 flex flex-col justify-between backface-hidden shadow-2xl hover:border-amber-500/50 transition-colors">
                    
                    <!-- Header -->
                    <div class="flex items-start justify-between gap-2">
                        <span class="text-[11px] font-mono px-3 py-1 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20 font-semibold">
                            ${card.category}
                        </span>
                        
                        <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                            <button 
                                onclick="toggleMastered(${card.id})" 
                                class="p-2 rounded-xl transition-colors ${isMastered ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-500 hover:text-slate-300 bg-slate-800'}" 
                                title="${isMastered ? 'Mark as learning' : 'Mark as mastered'}">
                                <i data-lucide="${isMastered ? 'check-circle-2' : 'circle'}" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Question Content -->
                    <div class="my-auto text-center px-2 py-2">
                        <p class="text-xs uppercase tracking-widest text-slate-500 font-mono mb-2">Daily Life Question</p>
                        <h2 class="text-xl sm:text-2xl font-extrabold text-white leading-snug">
                            "${card.question}"
                        </h2>
                        <p class="text-xs text-amber-200/80 mt-3 italic">
                            💡 ${card.hint}
                        </p>
                    </div>

                    <!-- Card Front Footer -->
                    <div class="flex items-center justify-between pt-3 border-t border-slate-800 text-xs text-slate-400">
                        <button 
                            onclick="event.stopPropagation(); speakText('${card.question.replace(/'/g, "\\'")}')" 
                            class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-colors font-medium">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                            <span>Listen</span>
                        </button>
                        <span class="text-slate-500 flex items-center gap-1.5 text-xs font-medium">
                            Click to see answer <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                        </span>
                    </div>
                </div>

                <!-- BACK OF CARD -->
                <div class="absolute inset-0 w-full h-full bg-slate-900 border border-amber-500/40 rounded-3xl p-6 flex flex-col justify-between backface-hidden rotate-y-180 shadow-2xl bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950">
                    
                    <!-- Words Section -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-mono uppercase tracking-wider text-amber-400 flex items-center gap-1 font-semibold">
                                <i data-lucide="book-open" class="w-4 h-4"></i> Useful Vocabulary
                            </span>
                            <span class="text-[10px] text-slate-500 font-mono">A2 Level</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            ${card.words.map(w => `
                                <div class="bg-slate-800/80 border border-slate-700/60 p-2 rounded-xl text-xs">
                                    <div class="font-bold text-slate-100">${w.en}</div>
                                    <div class="text-[11px] text-amber-300/90 font-medium">${w.es}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Sentence Starter Section -->
                    <div class="bg-slate-800/50 border border-amber-500/20 rounded-2xl p-3.5 my-2">
                        <span class="text-[10px] font-mono text-emerald-400 uppercase tracking-wide block mb-1 font-semibold">
                            How to start your answer:
                        </span>
                        <p class="text-xs sm:text-sm text-slate-100 font-medium leading-relaxed">
                            "${card.starter}"
                        </p>
                    </div>

                    <!-- Card Back Footer -->
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs text-slate-400" onclick="event.stopPropagation()">
                        <button 
                            onclick="speakText('${card.starter.replace(/'/g, "\\'")}')" 
                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 transition-colors font-medium">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                            <span>Listen Answer</span>
                        </button>

                        <button 
                            onclick="flipSingleCard()" 
                            class="text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1 py-1.5 px-2.5 rounded-xl bg-slate-800">
                            <span>Flip back</span>
                            <i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>

                </div>
            `;

            // Reset flip state when card renders
            singleCardInner.classList.remove("rotate-y-180");

            // Click listener for card flip
            singleCardInner.onclick = () => {
                singleCardInner.classList.toggle("rotate-y-180");
            };

            lucide.createIcons();
        }

        window.flipSingleCard = function() {
            singleCardInner.classList.toggle("rotate-y-180");
        }

        function renderGridCards(filtered) {
            gridViewContainer.innerHTML = "";

            filtered.forEach(card => {
                const isMastered = masteredCardIds.has(card.id);
                const cardEl = document.createElement("div");
                cardEl.className = "perspective-1000 h-[380px] w-full";

                cardEl.innerHTML = `
                    <div id="grid-card-inner-${card.id}" class="relative w-full h-full duration-500 transform-style-3d cursor-pointer group">
                        
                        <!-- FRONT OF CARD -->
                        <div class="absolute inset-0 w-full h-full bg-slate-900 border ${isMastered ? 'border-emerald-500/60' : 'border-slate-800'} rounded-2xl p-5 flex flex-col justify-between backface-hidden shadow-xl hover:border-amber-500/50 transition-colors">
                            
                            <!-- Card Header -->
                            <div class="flex items-start justify-between gap-2">
                                <span class="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-slate-800 text-amber-300 border border-slate-700 font-semibold">
                                    ${card.category}
                                </span>
                                
                                <button 
                                    onclick="event.stopPropagation(); toggleMastered(${card.id})" 
                                    class="p-1.5 rounded-lg transition-colors ${isMastered ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-500 hover:text-slate-300 bg-slate-800'}" 
                                    title="${isMastered ? 'Mark as learning' : 'Mark as mastered'}">
                                    <i data-lucide="${isMastered ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <!-- Question Content -->
                            <div class="my-auto py-2 text-center px-1">
                                <h3 class="text-base font-bold text-slate-100 leading-snug">
                                    "${card.question}"
                                </h3>
                                <p class="text-[11px] text-amber-200/70 mt-2 italic">
                                    ${card.hint}
                                </p>
                            </div>

                            <!-- Footer -->
                            <div class="flex items-center justify-between pt-2.5 border-t border-slate-800 text-xs text-slate-400">
                                <button 
                                    onclick="event.stopPropagation(); speakText('${card.question.replace(/'/g, "\\'")}')" 
                                    class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-colors text-[11px]">
                                    <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                                    <span>Listen</span>
                                </button>
                                <span class="text-slate-500 text-[10px] flex items-center gap-1">
                                    Flip <i data-lucide="rotate-cw" class="w-3 h-3"></i>
                                </span>
                            </div>
                        </div>

                        <!-- BACK OF CARD -->
                        <div class="absolute inset-0 w-full h-full bg-slate-900 border border-amber-500/40 rounded-2xl p-4 flex flex-col justify-between backface-hidden rotate-y-180 shadow-2xl">
                            
                            <div class="space-y-2">
                                <span class="text-[10px] font-mono uppercase tracking-wider text-amber-400 font-semibold block">
                                    Useful Vocabulary
                                </span>
                                <div class="grid grid-cols-2 gap-1.5">
                                    ${card.words.map(w => `
                                        <div class="bg-slate-800 p-1.5 rounded-lg text-[11px]">
                                            <div class="font-bold text-slate-200">${w.en}</div>
                                            <div class="text-amber-300/80 text-[10px]">${w.es}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="bg-slate-800/60 border border-amber-500/20 rounded-xl p-2.5 my-1">
                                <span class="text-[9px] font-mono text-emerald-400 uppercase tracking-wide block mb-0.5">
                                    Start Answer:
                                </span>
                                <p class="text-xs text-slate-200 font-medium">
                                    "${card.starter}"
                                </p>
                            </div>

                            <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-[11px]" onclick="event.stopPropagation()">
                                <button 
                                    onclick="speakText('${card.starter.replace(/'/g, "\\'")}')" 
                                    class="flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20">
                                    <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                                    <span>Listen</span>
                                </button>
                                <button 
                                    onclick="flipGridCard(${card.id})" 
                                    class="text-slate-400 hover:text-slate-200 px-2 py-1 bg-slate-800 rounded-lg">
                                    Back
                                </button>
                            </div>

                        </div>
                    </div>
                `;

                const gridInner = cardEl.querySelector(`#grid-card-inner-${card.id}`);
                cardEl.addEventListener("click", () => {
                    gridInner.classList.toggle("rotate-y-180");
                });

                gridViewContainer.appendChild(cardEl);
            });

            lucide.createIcons();
        }

        window.flipGridCard = function(id) {
            const gridInner = document.getElementById(`grid-card-inner-${id}`);
            if (gridInner) {
                gridInner.classList.toggle("rotate-y-180");
            }
        }

        window.toggleMastered = function(id) {
            if (masteredCardIds.has(id)) {
                masteredCardIds.delete(id);
            } else {
                masteredCardIds.add(id);
            }
            saveMasteredState();
            updateProgress();
            renderViews();
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
