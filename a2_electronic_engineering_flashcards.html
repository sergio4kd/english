        // Categories List
        const CATEGORIES = [
            "All Categories",
            "Workbench & Tools",
            "Components & Circuits",
            "Testing & Troubleshooting",
            "Workplace Communication & Teamwork",
            "Safety & Lab Rules",
            "Simple Project Tasks"
        ];
    </script>

    <script>
        // App State
        let currentCategory = "All Categories";
        let searchQuery = "";
        let showOnlyMastered = false;
        let cardsData = [...FLASHCARDS_DATA];
        
        // LocalStorage for Mastered IDs
        let masteredCardIds = new Set(JSON.parse(localStorage.getItem("electro_mastered_cards") || "[]"));

        // DOM Elements
        const gridContainer = document.getElementById("flashcards-grid");
        const emptyState = document.getElementById("empty-state");
        const searchInput = document.getElementById("search-input");
        const categoryFiltersContainer = document.getElementById("category-filters");
        const shuffleBtn = document.getElementById("shuffle-btn");
        const toggleFilterMasteredBtn = document.getElementById("toggle-filter-mastered");
        const masteredFilterLabel = document.getElementById("mastered-filter-label");
        const progressText = document.getElementById("progress-text");
        const progressBar = document.getElementById("progress-bar");
        const resetProgressBtn = document.getElementById("reset-progress-btn");

        // Speech Synthesis setup
        const synth = window.speechSynthesis;

        function speakText(text, lang = "en-US") {
            if (!synth) {
                alert("Text-to-speech is not supported in this browser.");
                return;
            }
            synth.cancel(); // stop previous speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9; // Slightly slower speech speed for A2 students
            synth.speak(utterance);
        }

        // Initialize App
        function initApp() {
            renderCategoryButtons();
            renderCards();
            updateProgress();
            
            // Event Listeners
            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderCards();
            });

            shuffleBtn.addEventListener("click", () => {
                shuffleCards();
            });

            toggleFilterMasteredBtn.addEventListener("click", () => {
                showOnlyMastered = !showOnlyMastered;
                masteredFilterLabel.textContent = showOnlyMastered ? "Mastered Only" : "Show All";
                toggleFilterMasteredBtn.classList.toggle("bg-emerald-500/20", showOnlyMastered);
                toggleFilterMasteredBtn.classList.toggle("border-emerald-500/50", showOnlyMastered);
                renderCards();
            });

            resetProgressBtn.addEventListener("click", () => {
                if (confirm("Reset all mastered flashcards progress?")) {
                    masteredCardIds.clear();
                    saveMasteredState();
                    updateProgress();
                    renderCards();
                }
            });

            // Initialize Lucide icons
            lucide.createIcons();
        }

        function saveMasteredState() {
            localStorage.setItem("electro_mastered_cards", JSON.stringify([...masteredCardIds]));
        }

        function updateProgress() {
            const total = FLASHCARDS_DATA.length;
            const count = masteredCardIds.size;
            const percentage = Math.round((count / total) * 100);
            
            progressText.textContent = `${count}/${total} Mastered`;
            progressBar.style.width = `${percentage}%`;
        }

        function renderCategoryButtons() {
            categoryFiltersContainer.innerHTML = CATEGORIES.map(cat => {
                const isActive = cat === currentCategory;
                const activeClasses = isActive 
                    ? "bg-cyan-500 text-slate-950 font-semibold shadow-lg shadow-cyan-500/20" 
                    : "bg-slate-800/80 text-slate-300 hover:bg-slate-700 border border-slate-700/60";
                return `
                    <button 
                        onclick="selectCategory('${cat}')" 
                        class="px-3.5 py-1.5 rounded-xl transition-all whitespace-nowrap text-xs font-medium ${activeClasses}">
                        ${cat}
                    </button>
                `;
            }).join("");
        }

        window.selectCategory = function(cat) {
            currentCategory = cat;
            renderCategoryButtons();
            renderCards();
        }

        function shuffleCards() {
            // Simple Fisher-Yates shuffle algorithm
            for (let i = cardsData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardsData[i], cardsData[j]] = [cardsData[j], cardsData[i]];
            }
            renderCards();
        }

        function renderCards() {
            gridContainer.innerHTML = "";

            const filtered = cardsData.filter(card => {
                const matchesCategory = (currentCategory === "All Categories") || (card.category === currentCategory);
                
                const matchesSearch = searchQuery === "" || 
                    card.question.toLowerCase().includes(searchQuery) ||
                    card.starter.toLowerCase().includes(searchQuery) ||
                    card.words.some(w => w.en.toLowerCase().includes(searchQuery) || w.es.toLowerCase().includes(searchQuery));

                const matchesMastered = !showOnlyMastered || masteredCardIds.has(card.id);

                return matchesCategory && matchesSearch && matchesMastered;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove("hidden");
            } else {
                emptyState.classList.add("hidden");
            }

            filtered.forEach(card => {
                const isMastered = masteredCardIds.has(card.id);
                const cardEl = document.createElement("div");
                cardEl.className = "perspective-1000 h-[380px] w-full";
                
                cardEl.innerHTML = `
                    <div id="card-inner-${card.id}" class="relative w-full h-full duration-500 transform-style-3d cursor-pointer group">
                        
                        <!-- FRONT OF CARD -->
                        <div class="absolute inset-0 w-full h-full bg-slate-900 border ${isMastered ? 'border-emerald-500/50' : 'border-slate-800'} rounded-2xl p-5 flex flex-col justify-between backface-hidden shadow-xl hover:border-cyan-500/60 transition-colors">
                            
                            <!-- Card Header -->
                            <div class="flex items-start justify-between gap-2">
                                <span class="text-[11px] font-mono px-2 py-1 rounded-md bg-slate-800 text-cyan-400 border border-slate-700/60 font-medium">
                                    ${card.category}
                                </span>
                                
                                <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                                    <button 
                                        onclick="toggleMastered(${card.id})" 
                                        class="p-1.5 rounded-lg transition-colors ${isMastered ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-500 hover:text-slate-300 bg-slate-800/60'}" 
                                        title="${isMastered ? 'Mark as learning' : 'Mark as mastered'}">
                                        <i data-lucide="${isMastered ? 'check-circle-2' : 'circle'}" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Question Content -->
                            <div class="my-auto py-4 text-center px-2">
                                <p class="text-xs uppercase tracking-wider text-slate-500 font-mono mb-2">Question / Situation</p>
                                <h3 class="text-lg sm:text-xl font-bold text-slate-100 leading-snug">
                                    "${card.question}"
                                </h3>
                            </div>

                            <!-- Card Front Footer -->
                            <div class="flex items-center justify-between pt-3 border-t border-slate-800/80 text-xs text-slate-400">
                                <button 
                                    onclick="event.stopPropagation(); speakText('${card.question.replace(/'/g, "\\'")}')" 
                                    class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 transition-colors">
                                    <i data-lucide="volume-2" class="w-4 h-4"></i>
                                    <span>Listen</span>
                                </button>
                                <span class="text-slate-500 flex items-center gap-1 text-[11px]">
                                    Click to flip <i data-lucide="rotate-cw" class="w-3 h-3"></i>
                                </span>
                            </div>
                        </div>

                        <!-- BACK OF CARD -->
                        <div class="absolute inset-0 w-full h-full bg-slate-900 border border-cyan-500/40 rounded-2xl p-5 flex flex-col justify-between backface-hidden rotate-y-180 shadow-2xl bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950">
                            
                            <!-- Words Section -->
                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-[10px] font-mono uppercase tracking-wider text-cyan-400 flex items-center gap-1">
                                        <i data-lucide="book-open" class="w-3 h-3"></i> Words you can use
                                    </span>
                                    <span class="text-[10px] text-slate-500 font-mono">A2 Vocabulary</span>
                                </div>

                                <div class="grid grid-cols-2 gap-2">
                                    ${card.words.map(w => `
                                        <div class="bg-slate-800/70 border border-slate-700/50 p-2 rounded-lg text-xs">
                                            <div class="font-semibold text-slate-200">${w.en}</div>
                                            <div class="text-[11px] text-cyan-300/80">${w.es}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Example Answer Section -->
                            <div class="bg-slate-800/40 border border-cyan-500/20 rounded-xl p-3 my-2">
                                <span class="text-[10px] font-mono text-emerald-400 uppercase tracking-wide block mb-1">
                                    Simple Answer:
                                </span>
                                <p class="text-xs sm:text-sm text-slate-200 italic font-sans leading-relaxed">
                                    "${card.starter}"
                                </p>
                            </div>

                            <!-- Card Back Footer -->
                            <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs text-slate-400" onclick="event.stopPropagation()">
                                <button 
                                    onclick="speakText('${card.starter.replace(/'/g, "\\'")}')" 
                                    class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 transition-colors">
                                    <i data-lucide="volume-2" class="w-4 h-4"></i>
                                    <span>Listen Answer</span>
                                </button>

                                <button 
                                    onclick="flipCard(${card.id})" 
                                    class="text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1 py-1 px-2 rounded bg-slate-800/80">
                                    <span>Flip back</span>
                                    <i data-lucide="undo-2" class="w-3 h-3"></i>
                                </button>
                            </div>

                        </div>
                    </div>
                `;

                // Add flip handler on card wrapper click
                const cardInner = cardEl.querySelector(`#card-inner-${card.id}`);
                cardEl.addEventListener("click", () => {
                    cardInner.classList.toggle("rotate-y-180");
                });

                gridContainer.appendChild(cardEl);
            });

            lucide.createIcons();
        }

        window.flipCard = function(id) {
            const cardInner = document.getElementById(`card-inner-${id}`);
            if (cardInner) {
                cardInner.classList.toggle("rotate-y-180");
            }
        }

        window.toggleMastered = function(id) {
            if (masteredCardIds.has(id)) {
                masteredCardIds.delete(id);
            } else {
                masteredCardIds.add(id);
            }
            saveMasteredState();
            updateProgress();
            renderCards();
        }

        // Initialize on load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
